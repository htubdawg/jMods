
name: Sync Mods

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-mods
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout jMods
        uses: actions/checkout@v4

      - name: Sync latest releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPOS=(
            HalfGripOpenWorld
            HalfGripSlapPack
            HalfGripStereo
            HalfGripMiniMap
            ProcTrack
            HalfGripHelicopter
          )

          mkdir -p mods
          rm -rf mods/*

          for repo in "${REPOS[@]}"; do
            echo "Checking $repo..."

            if ! tag=$(gh api \
              "repos/htubdawg/$repo/releases/latest" \
              --jq '.tag_name' 2>/dev/null); then
              echo "No published release for $repo; skipping."
              continue
            fi

            echo "Downloading $repo release $tag"

            archive_url=$(gh api \
              "repos/htubdawg/$repo/releases/latest" \
              --jq '.zipball_url')

            workdir=$(mktemp -d)
            curl -fLsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$archive_url" \
              -o "$workdir/release.zip"

            mkdir -p "$workdir/extracted"
            unzip -q "$workdir/release.zip" \
              -d "$workdir/extracted"

            while IFS= read -r -d '' manifest; do
              source_dir="$(dirname "$manifest")"
              mod_name="$(basename "$source_dir")"
              destination="mods/$mod_name"

              if [ -e "$destination" ]; then
                echo "Duplicate mod folder: $mod_name"
                exit 1
              fi

              mkdir -p "$destination"
              cp -a "$source_dir/." "$destination/"
              echo "Added $mod_name from $repo ($tag)"
            done < <(
              find "$workdir/extracted" \
                -name mod.json -type f -print0
            )

            rm -rf "$workdir"
          done

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A mods

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Sync mods from latest releases"
          git push
